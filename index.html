<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职业与设备看图填字游戏 (Jobs & Appliances Quiz)</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f39c12;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-container {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-top: 0;
            font-size: 24px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .img-container {
            width: 100%;
            max-height: 280px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }

        .img-container img {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
        }

        .clue-box {
            background-color: #f8f9fa;
            border-left: 4px solid var(--primary-color);
            padding: 12px 16px;
            margin-bottom: 20px;
            text-align: left;
            border-radius: 0 8px 8px 0;
        }

        .clue-title {
            font-size: 14px;
            color: #666;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .clue-text {
            font-size: 18px;
            color: #2c3e50;
            font-weight: 600;
        }

        .inputs-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .letter-input {
            width: 40px;
            height: 50px;
            font-size: 24px;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-weight: bold;
            color: #333;
            transition: all 0.2s;
        }

        .letter-input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
        }

        .letter-input.given {
            background-color: #e8f4fd;
            border-color: #a4cbf5;
            color: var(--primary-color);
        }

        .letter-input.correct {
            background-color: #d4edda;
            border-color: var(--success-color);
            color: #155724;
        }

        .letter-input.wrong {
            background-color: #f8d7da;
            border-color: var(--error-color);
            color: #721c24;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-submit:hover {
            background-color: #357abd;
        }

        .btn-next {
            background-color: var(--success-color);
            color: white;
            display: none;
        }

        .btn-next:hover {
            background-color: #27ae60;
        }

        .message-box {
            height: 24px;
            margin-top: 12px;
            font-weight: bold;
            font-size: 16px;
        }

        .score-board {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }

        /* 结束结算画面 */
        .result-screen {
            display: none;
        }

        .result-screen h2 {
            color: var(--success-color);
        }

        .btn-restart {
            background-color: var(--secondary-color);
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🧩 看图与解释填字游戏</h1>
    
    <div id="quiz-screen">
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="img-container">
            <!-- 预设使用卡通风图片的外部在线示范链接，可替换为本地路径或图片链接 -->
            <img id="game-img" src="" alt="提示图片">
        </div>

        <div class="clue-box">
            <div class="clue-title">英文释义提示 (Clue):</div>
            <div class="clue-text" id="clue-text">--</div>
        </div>

        <div class="inputs-container" id="inputs-container">
            <!-- 动态生成字母输入框 -->
        </div>

        <div class="controls">
            <button class="btn-submit" id="submit-btn" onclick="checkAnswer()">检查答案</button>
            <button class="btn-next" id="next-btn" onclick="nextQuestion()">下一题 ➔</button>
        </div>

        <div class="message-box" id="message"></div>
        <div class="score-board">进度: <span id="current-index">1</span> / <span id="total-count">7</span></div>
    </div>

    <div class="result-screen" id="result-screen">
        <h2>🎉 太棒了！你完成了所有题目！</h2>
        <p>你已经掌握了这 7 个职业与设备的英文单词！</p>
        <button class="btn-restart" onclick="restartGame()">再玩一次 ↺</button>
    </div>
</div>

<script>
    // 游戏题目数据
    const questions = [
        {
            word: "FRIDGE",
            clue: "The thing that keeps the food fresh.",
            // 采用卡通风风格图片在线资源示意
            img: "https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=600&auto=format&fit=crop&q=80"
        },
        {
            word: "PILOT",
            clue: "A person who flies an airplane in the sky.",
            img: "https://images.unsplash.com/photo-1519074069444-1ba4e6d427d1?w=600&auto=format&fit=crop&q=80"
        },
        {
            word: "FARMER",
            clue: "A person who works on a farm to grow vegetables.",
            img: "https://images.unsplash.com/photo-1500937386664-56d1dfef3854?w=600&auto=format&fit=crop&q=80"
        },
        {
            word: "PHOTOGRAPHER",
            clue: "A person who takes photos with a camera.",
            img: "https://images.unsplash.com/photo-1554048612-b6a482bc67e5?w=600&auto=format&fit=crop&q=80"
        },
        {
            word: "FIREFIGHTER",
            clue: "A person who puts out fires and saves people.",
            img: "https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=600&auto=format&fit=crop&q=80"
        },
        {
            word: "LIFEGUARD",
            clue: "A person who saves people at the beach or pool.",
            img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop&q=80"
        },
        {
            word: "DENTIST",
            clue: "A person who checks and fixes your teeth.",
            img: "https://images.unsplash.com/photo-1606811841689-23dfddce3e95?w=600&auto=format&fit=crop&q=80"
        }
    ];

    let currentIndex = 0;

    const gameImg = document.getElementById('game-img');
    const clueText = document.getElementById('clue-text');
    const inputsContainer = document.getElementById('inputs-container');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressEl = document.getElementById('progress');
    const currentIndexEl = document.getElementById('current-index');
    const totalCountEl = document.getElementById('total-count');

    // 初始化游戏
    function initGame() {
        currentIndex = 0;
        totalCountEl.textContent = questions.length;
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        loadQuestion();
    }

    // 加载题目
    function loadQuestion() {
        const q = questions[currentIndex];
        
        // 更新基本信息
        gameImg.src = q.img;
        clueText.textContent = q.clue;
        messageEl.textContent = "";
        messageEl.style.color = "";
        currentIndexEl.textContent = currentIndex + 1;

        // 更新进度条
        const progressPercent = (currentIndex / questions.length) * 100;
        progressEl.style.width = `${progressPercent}%`;

        // 显示检查答案按钮，隐藏下一题按钮
        submitBtn.style.display = 'inline-block';
        nextBtn.style.display = 'none';

        // 生成填字框
        inputsContainer.innerHTML = "";
        for (let i = 0; i < q.word.length; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.maxLength = 1;
            input.className = 'letter-input';
            input.dataset.index = i;

            // 首字母固定提示，不让修改
            if (i === 0) {
                input.value = q.word[0];
                input.classList.add('given');
                input.readOnly = true;
            }

            // 键盘事件监听 (自动跳格与回退)
            input.addEventListener('input', handleInput);
            input.addEventListener('keydown', handleKeydown);

            inputsContainer.appendChild(input);
        }
    }

    // 处理字母输入与自动跳格
    function handleInput(e) {
        const input = e.target;
        const val = input.value.toUpperCase();
        input.value = val;

        if (val && input.nextElementSibling) {
            input.nextElementSibling.focus();
        }
    }

    // 处理退格键(Backspace)
    function handleKeydown(e) {
        const input = e.target;
        if (e.key === 'Backspace' && !input.value && input.previousElementSibling) {
            if (!input.previousElementSibling.readOnly) {
                input.previousElementSibling.focus();
            }
        } else if (e.key === 'Enter') {
            checkAnswer();
        }
    }

    // 检查答案
    function checkAnswer() {
        const q = questions[currentIndex];
        const inputs = inputsContainer.querySelectorAll('.letter-input');
        let userWord = "";

        inputs.forEach(input => {
            userWord += (input.value || " ").toUpperCase();
        });

        if (userWord === q.word) {
            // 正确处理
            inputs.forEach(input => {
                input.classList.remove('wrong');
                input.classList.add('correct');
                input.readOnly = true;
            });

            messageEl.style.color = "var(--success-color)";
            messageEl.textContent = "✓ 答对了！真棒！";

            submitBtn.style.display = 'none';
            nextBtn.style.display = 'inline-block';
        } else {
            // 错误处理
            inputs.forEach((input, index) => {
                if (!input.readOnly) {
                    if (input.value.toUpperCase() !== q.word[index]) {
                        input.classList.add('wrong');
                        setTimeout(() => input.classList.remove('wrong'), 500);
                    }
                }
            });

            messageEl.style.color = "var(--error-color)";
            messageEl.textContent = "✕ 还没完全对哦，再试试看！";
        }
    }

    // 下一题
    function nextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    // 显示最终结果
    function showResult() {
        progressEl.style.width = `100%`;
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
    }

    // 重新开始游戏
    function restartGame() {
        initGame();
    }

    // 页面加载完成后运行
    window.onload = initGame;
</script>

</body>
</html>
